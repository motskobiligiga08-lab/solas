<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solas - AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d0f17; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(23, 27, 44, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-bg { background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 50%); }
  </style>
</head>
<body class="h-screen flex overflow-hidden glow-bg">

  <!-- Sidebar -->
  <aside class="w-64 glass flex flex-col justify-between p-4 border-r border-slate-800">
    <div>
      <div class="flex items-center space-x-3 mb-6">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/30">✦</div>
        <div>
          <h1 class="font-bold text-lg tracking-wide text-white">SOLAS</h1>
          <p class="text-xs text-indigo-400 font-medium">INTELLIGENCE</p>
        </div>
      </div>
      <button onclick="startNewChat()" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-plus text-sm"></i><span>New Conversation</span>
      </button>
      <div id="chatHistory" class="mt-6 space-y-1 overflow-y-auto max-h-[50vh]"></div>
    </div>

    <div class="space-y-2 pt-4 border-t border-slate-800 text-sm">
      <button onclick="openSettings()" class="w-full flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-slate-800/60 text-slate-300 transition">
        <i class="fa-solid fa-sliders text-indigo-400"></i><span>Persona & Settings</span>
      </button>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col h-full relative">
    <header class="p-4 glass flex justify-between items-center border-b border-slate-800">
      <div class="flex items-center space-x-2">
        <span class="text-sm font-semibold text-slate-200">✦ Solas Standard</span>
      </div>
    </header>

    <div id="messagesContainer" class="flex-1 overflow-y-auto p-6 space-y-6">
      <div class="text-center my-12 text-slate-400">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mx-auto mb-3 text-2xl">✦</div>
        <h2 class="text-xl font-bold text-white mb-1">Welcome to Solas</h2>
        <p class="text-sm text-slate-400">Type a prompt to chat, <code class="bg-slate-800 px-2 py-0.5 rounded text-indigo-300">/imagine prompt</code> for photos, or <code class="bg-slate-800 px-2 py-0.5 rounded text-indigo-300">/video prompt</code> for AI clips.</p>
      </div>
    </div>

    <div class="p-4 glass border-t border-slate-800">
      <div class="max-w-4xl mx-auto relative flex items-center">
        <textarea id="userInput" rows="1" placeholder="Message Solas, or use /imagine or /video..." class="w-full bg-slate-900/80 text-white rounded-2xl pl-4 pr-12 py-3.5 border border-slate-700/60 focus:border-indigo-500 focus:outline-none resize-none text-sm"></textarea>
        <button onclick="sendMessage()" class="absolute right-2 p-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-arrow-up text-sm"></i>
        </button>
      </div>
      <p class="text-center text-xs text-slate-500 mt-2">Solas can make mistakes. Verify important factual responses.</p>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-lg shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg text-white flex items-center space-x-2">
          <i class="fa-solid fa-sliders text-indigo-400"></i>
          <span>Solas Settings</span>
        </h3>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Gemini API Key (Chat & Reasoning)</label>
        <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-indigo-500 focus:outline-none">
      </div>

      <div class="flex justify-end space-x-3 pt-3 border-t border-slate-800">
        <button onclick="closeSettings()" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
        <button onclick="saveSettings()" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    function startNewChat() {
      document.getElementById('messagesContainer').innerHTML = `
        <div class="text-center my-12 text-slate-400">
          <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mx-auto mb-3 text-2xl">✦</div>
          <h2 class="text-xl font-bold text-white mb-1">Welcome to Solas</h2>
          <p class="text-sm text-slate-400">Type a prompt to chat, <code class="bg-slate-800 px-2 py-0.5 rounded text-indigo-300">/imagine prompt</code> for photos, or <code class="bg-slate-800 px-2 py-0.5 rounded text-indigo-300">/video prompt</code> for AI clips.</p>
        </div>`;
    }

    function openSettings() {
      document.getElementById('geminiKeyInput').value = localStorage.getItem('gemini_key') || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }
    function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
    function saveSettings() {
      localStorage.setItem('gemini_key', document.getElementById('geminiKeyInput').value.trim());
      closeSettings();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      let text = input.value.trim();
      if (!text) return;
      input.value = '';

      const container = document.getElementById('messagesContainer');
      container.innerHTML += `<div class="flex justify-end mb-4"><div class="bg-indigo-600 text-white py-2.5 px-4 rounded-2xl max-w-xl text-sm">${text}</div></div>`;

      // Handling Video Generation
      if (text.startsWith('/video')) {
        let prompt = text.replace('/video', '').trim();
        if (!prompt) prompt = "a peaceful ocean sunset";

        const loadingId = 'vid-' + Date.now();
        container.innerHTML += `<div id="${loadingId}" class="flex justify-start mb-4"><div class="bg-slate-800 text-slate-300 p-4 rounded-2xl text-sm animate-pulse">✦ Generating video for "${prompt}"... (this may take 15–30s)</div></div>`;

        const encodedPrompt = encodeURIComponent(prompt);
        const videoUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=600&height=400&model=video&seed=${Math.floor(Math.random() * 100000)}`;

        const video = document.createElement('video');
        video.src = videoUrl;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.className = "rounded-xl w-full object-cover";

        video.onloadeddata = () => {
          const loadingElem = document.getElementById(loadingId);
          if (loadingElem) {
            loadingElem.innerHTML = `<div class="bg-slate-800 p-2 rounded-2xl max-w-lg border border-slate-700 shadow-xl"></div>`;
            loadingElem.querySelector('div').appendChild(video);
          }
        };

        video.onerror = () => {
          const loadingElem = document.getElementById(loadingId);
          if (loadingElem) {
            loadingElem.innerHTML = `<div class="bg-slate-800 text-red-400 p-4 rounded-2xl text-sm">❌ Video generation failed or timed out. Try again.</div>`;
          }
        };
      } 
      // Handling Image Generation
      else if (text.startsWith('/imagine')) {
        let prompt = text.replace('/imagine', '').trim();
        if (!prompt) prompt = "beautiful scenery";

        const loadingId = 'img-' + Date.now();
        container.innerHTML += `<div id="${loadingId}" class="flex justify-start mb-4"><div class="bg-slate-800 text-slate-300 p-4 rounded-2xl text-sm animate-pulse">✦ Rendering image for "${prompt}"...</div></div>`;

        const encodedPrompt = encodeURIComponent(prompt);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=800&height=600&nologo=true&seed=${Math.floor(Math.random() * 100000)}`;

        const img = new Image();
        img.src = imageUrl;
        img.className = "rounded-xl w-full object-cover";
        img.onload = () => {
          const loadingElem = document.getElementById(loadingId);
          if (loadingElem) {
            loadingElem.innerHTML = `<div class="bg-slate-800 p-2 rounded-2xl max-w-lg border border-slate-700 shadow-xl"></div>`;
            loadingElem.querySelector('div').appendChild(img);
          }
        };
        img.onerror = () => {
          const loadingElem = document.getElementById(loadingId);
          if (loadingElem) {
            loadingElem.innerHTML = `<div class="bg-slate-800 text-red-400 p-4 rounded-2xl text-sm">❌ Image generation failed. Please try again.</div>`;
          }
        };
      } 
      // Handling Gemini Chat Text
      else {
        const geminiKey = localStorage.getItem('gemini_key');
        if (!geminiKey) {
          container.innerHTML += `<div class="flex justify-start mb-4"><div class="bg-slate-800 text-red-400 p-4 rounded-2xl text-sm">⚠️ Please add your Gemini API key in Persona & Settings.</div></div>`;
          return;
        }
        const loadingId = 'txt-' + Date.now();
        container.innerHTML += `<div id="${loadingId}" class="flex justify-start mb-4"><div class="bg-slate-800 text-slate-300 p-4 rounded-2xl text-sm animate-pulse">✦ Solas is thinking...</div></div>`;
        
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${geminiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
          });
          const data = await res.json();

          if (data.error) {
            document.getElementById(loadingId).innerHTML = `<div class="bg-slate-800 text-red-400 p-4 rounded-2xl text-sm">❌ ${data.error.message}</div>`;
            return;
          }

          const reply = data.candidates[0].content.parts[0].text;
          document.getElementById(loadingId).innerHTML = `<div class="bg-slate-800 text-slate-200 p-4 rounded-2xl max-w-xl text-sm whitespace-pre-wrap">${reply}</div>`;
        } catch (e) {
          document.getElementById(loadingId).innerHTML = `<div class="bg-slate-800 text-red-400 p-4 rounded-2xl text-sm">❌ Network error. Check your connection or API key.</div>`;
        }
      }
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
